[package]
name = "css-proxy"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = "0.7"
lol_html = "3.0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.2.1"
